# Exoplanetary science = Data science
<span class="fragment">The vast majority of exoplanetary science is, in fact, **data science**.</span>
- <span class="fragment">API/SQL database access</span>
- <span class="fragment">Regression & classification</span>
- <span class="fragment">Model building, optimising, sampling.</span>
- <span class="fragment">Data visualisation</span>
-v-

## Most problems in observational astronomy can be thought of in the following way:
1) <span class="fragment">Imagine a **hypothesis** (transit, supernova, etc)</span>
2) <span class="fragment">Create a **parameterised model** translating physics into observables</span>
3) <span class="fragment">Take **observations** (+ "reduce" them, e.g. remove systematic noise)</span>
4) <span class="fragment">**Fit** the model to the observations</span>
5) <span class="fragment">**Sample** the parameters to derive uncertainties</span>
6) <span class="fragment">Use **model comparison** to test whether the hypothesis is justified</span>
