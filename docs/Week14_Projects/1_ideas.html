

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

        
            <link rel="icon" href="../all_slides/slide_data/data/unibe_transit_icon2.ico">
        

        <link rel="stylesheet" href="../mkslides-assets/reveal-js/dist/reveal.css" />

        
            <link rel="stylesheet" href="../slide_data/data/hohgent_slides_custom.css" />
        
        
            <link rel="stylesheet" href="../mkslides-assets/highlight-js-themes/vs.css" />
        

        
            
        
            
        
    </head>
    <body>
        <div class="reveal">
            <div class="slides">
                <section data-markdown
                
                    data-separator="^\s*---\s*$"
                
                    data-separator-vertical="^\s*-v-\s*$"
                
                    data-separator-notes="^Notes?:"
                
                    data-charset="utf-8"
                
                >
                    <!-- The markdown must be placed to the whole left to prevent indentation issues like https://github.com/MartenBE/mkslides/issues/52 -->
                    <textarea data-template>
Here are some ideas for a final project:
-
                    </textarea>
                </section>
            </div>
        </div>
        <script src="../mkslides-assets/reveal-js/dist/reveal.js"></script>
        <script src="../mkslides-assets/reveal-js/dist/plugin/highlight.js"></script>
        <script src="../mkslides-assets/reveal-js/dist/plugin/markdown.js"></script>
        <script src="../mkslides-assets/reveal-js/dist/plugin/math.js"></script>
        <script src="../mkslides-assets/reveal-js/dist/plugin/notes.js"></script>
        <script src="../mkslides-assets/reveal-js/dist/plugin/search.js"></script>
        <script src="../mkslides-assets/reveal-js/dist/plugin/zoom.js"></script>

        
            
                
                    
                        <script src="https://cdn.jsdelivr.net/npm/reveal.js-mermaid-plugin/plugin/mermaid/mermaid.min.js"></script>
                    
                
            
                
                    
                        <script src="https://cdn.jsdelivr.net/npm/reveal-plantuml/dist/reveal-plantuml.min.js"></script>
                    
                
            
        

        <script>
            Reveal.initialize({
                
                    
                        history: true,
                    
                        slideNumber: "c/t",
                    
                        height: 700,
                    
                        width: 960,
                    
                        transition: "fade",
                    
                        pdfSeparateFragments: false,
                    
                
                plugins: [
                    RevealMarkdown, // Must come before the other plugins so they can hook into the generated HTML.
                    RevealHighlight,
                    RevealMath.KaTeX,
                    RevealNotes,
                    RevealSearch,
                    RevealZoom,

                    
                        
                            
                                RevealMermaid,
                            
                        
                            
                        
                    
                ],
            });
        </script>
    </body>
</html>
