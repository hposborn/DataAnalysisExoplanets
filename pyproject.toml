readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arviz>=1.3.0",
    "astropy>=8.0.1",
    "astroquery>=0.4.11",
    "bgls>=0.2.0",
    "corner>=2.3.0",
    "dace-query>=3.0.2",
    "dynesty>=3.1.0",
    "emcee>=3.1.6",
    "exoplanet-core[pymc]>=0.4.0",
    "ipykernel>=7.3.0",
    "jax>=0.11.2",
    "jaxoplanet>=0.2.0",
    "kima>=6.4.1",
    "lightkurve>=2.5.1",
    "matplotlib>=3.11.0",
    "mkslides>=2.0.0",
    "nuance>=0.8.1",
    "numpy>=2.5.1",
    "numpyro>=0.22.0",
    "pandas>=3.0.3",
    "pymc>=6.3.2",
    "pytransit>=2.9.2",
    "radvel>=1.6.7",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "tinygp>=0.3.1",
    "tqdm>=4.70.1",
